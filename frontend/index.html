<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Metrics Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard">
        <h1>📊 System Metrics Dashboard</h1>
        <div class="metrics-container">
            <div class="card">
                <h3>CPU Usage</h3>
                <div class="progress-bar"><div id="cpu-bar" class="progress"></div></div>
                <p id="cpu-text">0%</p>
            </div>
            <div class="card">
                <h3>RAM Usage</h3>
                <div class="progress-bar"><div id="ram-bar" class="progress"></div></div>
                <p id="ram-text">0%</p>
            </div>
            <div class="card">
                <h3>Disk Usage</h3>
                <div class="progress-bar"><div id="disk-bar" class="progress"></div></div>
                <p id="disk-text">0%</p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
